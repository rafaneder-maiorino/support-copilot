[project]
name = "support-copilot"
version = "0.1.0"
description = "Hybrid support copilot: ticket triage, RAG with guardrails and drift monitoring (FIAP MLET Phase 5 Datathon)"
readme = "README.md"
authors = [
    { name = "Rafael Neder Maiorino", email = "rafaneder@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "evidently==0.7.23",
    "faiss-cpu>=1.16.0",
    "fastapi>=0.162.7",
    "fastembed>=0.9.1",
    "langchain-community>=0.4.2",
    "langchain-core>=1.8.0",
    "langchain-google-genai>=4.5.0",
    "langchain-openai>=1.8.0",
    "langchain-text-splitters>=1.1.3",
    "markdown-it-py>=4.3.0",
    "matplotlib>=3.11.2",
    "mlflow>=3.18.0",
    "pandas>=2.2,<3",
    "pandera>=0.36.0",
    "pyarrow>=26.0.1",
    "pypdf>=7.1.0",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "uvicorn[standard]>=0.54.0",
    "xgboost>=3.2.0",
]

[project.scripts]
support-copilot = "support_copilot:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "reportlab>=5.1.0",
    "ruff>=0.17.5",
]

[tool.uv]
# xgboost pulls NVIDIA NCCL (multi-GPU collectives, ~417 MB installed) on every Linux box. This
# project trains on CPU only and serves a linear model, so the Docker image drops it (D9, diario).
override-dependencies = [
    "nvidia-nccl-cu12 ; sys_platform == 'never'",
    "nvidia-nccl-cu13 ; sys_platform == 'never'",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "LOG"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: trains real models end to end (seconds)"]

[tool.coverage.run]
source = ["support_copilot"]
branch = true

[tool.coverage.report]
# Whole package. The critical modules (input validation, guardrails, RAG chat path, /ticket) have a
# stricter 95% gate in CI; drift/report.py and data/source.py are exercised by their scripts instead.
fail_under = 80
show_missing = true
skip_covered = true
